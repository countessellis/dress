[package]
name = "dress"
license = "MIT"
authors = ["Bethany Davis <ellis@despoena.com>"]
description = "A utility to find the dressings."
repository = "https://github.com/countessellis/dress"
version = "1.0.0"
edition = "2024"
default-run = "dress"

[[bin]]
name = "dress"
path = "src/bin/dress.rs"

[lib]
name = "dress"
path = "src/lib.rs"

[dependencies]
crossbeam-channel = "0.5"
env_logger = "0.11"
fast_html2md = "0.0.*"
log = "0.4"
mimalloc = "0.1"
multipart_ng = { version = "0.18", default-features = false, features = ["server"] }
nu-ansi-term = "0.50"
openssl = { version = "0.10", features = ["vendored"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = { version = "3.0", default-features = false, features = ["native-tls","vendored","gzip","json"] }
url = "2.5"

[build-dependencies]
chrono = "0.4"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
package."*".opt-level = "s"
