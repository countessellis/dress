[package]
name = "backless-dress"
license = "MIT"
authors = ["Bethany Davis <ellis@despoena.com>"]
description = "A utility to find the dressings."
repository = "https://github.com/countessellis/backless-dress"
version = "0.1.0"
edition = "2024"
default-run = "backless-dress"

[[bin]]
name = "backless-dress"
path = "src/bin/backless-dress.rs"

[lib]
name = "backless_dress"
path = "src/lib.rs"

[dependencies]
env_logger = "0.11"
html2md = "0.2"
log = "0.4"
mimalloc = "0.1"
nu-ansi-term = "0.50"
openssl = { version = "0.10", features = ["vendored"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.0", default-features = false, features = ["native-tls","vendored","gzip","json"] }

[build-dependencies]
chrono = "0.4"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
package."*".opt-level = "s"

